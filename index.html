
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralized Inventory and Resource Tracking System of LGU Tibiao</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            overflow-x: hidden;
        }
        .font-brand { font-family: 'Inter', sans-serif; }
        
        @media print {
            @page {
                size: landscape;
                margin: 0.4in;
            }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            
            /* Root level and main wrapper layout fixes */
            html, body { 
                height: auto !important;
                min-height: 0 !important;
                overflow: visible !important;
                background: white !important; 
                color: black !important;
                font-family: "Times New Roman", Times, serif !important;
            }
            #root, .min-h-screen, .h-screen, .h-full, .overflow-hidden, .overflow-y-auto, .overflow-x-hidden, .flex, .flex-col, .flex-row, .flex-1, main, .max-w-7xl, .max-w-5xl {
                display: block !important;
                height: auto !important;
                min-height: 0 !important;
                overflow: visible !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                max-width: none !important;
                position: relative !important;
                background: transparent !important;
                border: none !important;
                box-shadow: none !important;
            }
            
            /* Clean up print canvas wrapper */
            #report-canvas {
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                border: none !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                display: block !important;
            }
            
            /* Force the elements to page-break properly */
            thead {
                display: table-header-group !important;
            }
            tr {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
            
            /* Table formatting */
            table {
                width: 100% !important;
                border-collapse: collapse !important;
                border: 0.5pt solid black !important;
                table-layout: fixed !important;
            }
            th, td {
                border: 0.5pt solid black !important;
                padding: 6px 4px !important;
                font-size: 8.5pt !important;
                word-wrap: break-word;
            }
            th {
                background-color: #f1f5f9 !important; /* light gray header background for printable contrast */
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                font-weight: bold;
                text-transform: uppercase;
                color: black !important;
            }
            
            /* Ensure text-right/text-center alignments are applied correctly on print */
            .text-right {
                text-align: right !important;
            }
            .text-center {
                text-align: center !important;
            }
            .text-left {
                text-align: left !important;
            }
            
            /* Avoid splitting signatures block across pages */
            .grid-cols-2 {
                display: grid !important;
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                gap: 2rem !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        .mesh-bg {
            background-color: #0052CC;
            background-image: 
                radial-gradient(at 0% 0%, hsla(217,100%,39%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(215,100%,45%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(199,100%,33%,1) 0, transparent 50%), 
                radial-gradient(at 0% 100%, hsla(220,100%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 100%, hsla(210,100%,40%,1) 0, transparent 50%);
            background-size: 200% 200%;
            animation: mesh 15s ease infinite;
        }
        @keyframes mesh {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        /* Custom scrollbar for better UX */
        .custom-scrollbar::-webkit-scrollbar {
          width: 5px;
          height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
          background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
          background: #d1d5db;
          border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
          background: #9ca3af;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
