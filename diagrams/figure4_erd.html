<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Figure 4 - ERD</title>
<style>
  body { font-family: 'Times New Roman', Times, serif; margin: 20px; background: white; }
  h3 { text-align: center; font-size: 13px; margin-bottom: 10px; }
  svg { display: block; margin: 0 auto; }
  .caption { font-size: 11px; color: #555; text-align: center; font-style: italic; margin-top: 10px; max-width: 750px; margin-left: auto; margin-right: auto; }
</style>
</head>
<body>

<h3>Figure 4. ERD for the Centralized Inventory and Resource Tracking System of LGU Tibiao</h3>

<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" width="900" height="620" style="font-family: Arial, sans-serif;">
  
  <!-- Users Entity -->
  <rect x="30" y="30" width="160" height="130" rx="5" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
  <rect x="30" y="30" width="160" height="28" rx="5" fill="#2c3e50"/>
  <text x="110" y="50" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Users</text>
  <text x="40" y="78" fill="white" font-size="10">• userId (PK)</text>
  <text x="40" y="93" fill="white" font-size="10">• email</text>
  <text x="40" y="108" fill="white" font-size="10">• role</text>
  <text x="40" y="123" fill="white" font-size="10">• officeId (FK)</text>
  <text x="40" y="138" fill="white" font-size="10">• isActive</text>

  <!-- Offices Entity -->
  <rect x="370" y="30" width="160" height="110" rx="5" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <rect x="370" y="30" width="160" height="28" rx="5" fill="#27ae60"/>
  <text x="450" y="50" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Offices</text>
  <text x="380" y="78" fill="white" font-size="10">• officeId (PK)</text>
  <text x="380" y="93" fill="white" font-size="10">• officeName</text>
  <text x="380" y="108" fill="white" font-size="10">• description</text>
  <text x="380" y="123" fill="white" font-size="10">• isActive</text>

  <!-- Categories Entity -->
  <rect x="700" y="30" width="160" height="110" rx="5" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <rect x="700" y="30" width="160" height="28" rx="5" fill="#c0392b"/>
  <text x="780" y="50" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Categories</text>
  <text x="710" y="78" fill="white" font-size="10">• categoryId (PK)</text>
  <text x="710" y="93" fill="white" font-size="10">• categoryName</text>
  <text x="710" y="108" fill="white" font-size="10">• description</text>
  <text x="710" y="123" fill="white" font-size="10">• isActive</text>

  <!-- Assets Entity -->
  <rect x="250" y="200" width="180" height="150" rx="5" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <rect x="250" y="200" width="180" height="28" rx="5" fill="#e67e22"/>
  <text x="340" y="220" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Assets / Items</text>
  <text x="260" y="248" fill="white" font-size="10">• itemId (PK)</text>
  <text x="260" y="263" fill="white" font-size="10">• itemName</text>
  <text x="260" y="278" fill="white" font-size="10">• description</text>
  <text x="260" y="293" fill="white" font-size="10">• propertyNumber</text>
  <text x="260" y="308" fill="white" font-size="10">• quantity, unit</text>
  <text x="260" y="323" fill="white" font-size="10">• condition, status</text>
  <text x="260" y="338" fill="white" font-size="10">• officeId (FK), categoryId (FK)</text>

  <!-- Requisitions Entity -->
  <rect x="520" y="200" width="180" height="140" rx="5" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <rect x="520" y="200" width="180" height="28" rx="5" fill="#8e44ad"/>
  <text x="610" y="220" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Requisitions</text>
  <text x="530" y="248" fill="white" font-size="10">• requisitionId (PK)</text>
  <text x="530" y="263" fill="white" font-size="10">• requestedBy (FK)</text>
  <text x="530" y="278" fill="white" font-size="10">• officeId (FK)</text>
  <text x="530" y="293" fill="white" font-size="10">• status (pending/approved/declined)</text>
  <text x="530" y="308" fill="white" font-size="10">• items, purpose</text>
  <text x="530" y="323" fill="white" font-size="10">• dateRequested, dateResolved</text>

  <!-- Procurement Transactions Entity -->
  <rect x="30" y="400" width="180" height="130" rx="5" fill="#1abc9c" stroke="#16a085" stroke-width="2"/>
  <rect x="30" y="400" width="180" height="28" rx="5" fill="#16a085"/>
  <text x="120" y="420" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Procurement Txns</text>
  <text x="40" y="448" fill="white" font-size="10">• transactionId (PK)</text>
  <text x="40" y="463" fill="white" font-size="10">• requisitionId (FK)</text>
  <text x="40" y="478" fill="white" font-size="10">• supplier</text>
  <text x="40" y="493" fill="white" font-size="10">• deliveryDate</text>
  <text x="40" y="508" fill="white" font-size="10">• receivingStatus</text>

  <!-- System Logs Entity -->
  <rect x="300" y="420" width="150" height="110" rx="5" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
  <rect x="300" y="420" width="150" height="28" rx="5" fill="#2c3e50"/>
  <text x="375" y="440" text-anchor="middle" fill="white" font-size="13" font-weight="bold">System Logs</text>
  <text x="310" y="468" fill="white" font-size="10">• logId (PK)</text>
  <text x="310" y="483" fill="white" font-size="10">• userId (FK)</text>
  <text x="310" y="498" fill="white" font-size="10">• action</text>
  <text x="310" y="513" fill="white" font-size="10">• timestamp</text>

  <!-- Notifications Entity -->
  <rect x="520" y="400" width="160" height="110" rx="5" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <rect x="520" y="400" width="160" height="28" rx="5" fill="#d35400"/>
  <text x="600" y="420" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Notifications</text>
  <text x="530" y="448" fill="white" font-size="10">• notificationId (PK)</text>
  <text x="530" y="463" fill="white" font-size="10">• userId (FK)</text>
  <text x="530" y="478" fill="white" font-size="10">• message</text>
  <text x="530" y="493" fill="white" font-size="10">• isRead</text>

  <!-- Access Logs Entity -->
  <rect x="730" y="400" width="150" height="110" rx="5" fill="#7f8c8d" stroke="#6c7a7a" stroke-width="2"/>
  <rect x="730" y="400" width="150" height="28" rx="5" fill="#6c7a7a"/>
  <text x="805" y="420" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Access Logs</text>
  <text x="740" y="448" fill="white" font-size="10">• accessId (PK)</text>
  <text x="740" y="463" fill="white" font-size="10">• userId (FK)</text>
  <text x="740" y="478" fill="white" font-size="10">• loginTime</text>
  <text x="740" y="493" fill="white" font-size="10">• ipAddress</text>

  <!-- Relationship Lines -->
  <!-- Users -> Offices -->
  <line x1="190" y1="100" x2="370" y2="85" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="82" font-size="9" fill="#555">belongs to</text>

  <!-- Users -> Assets (1:N) -->
  <line x1="110" y1="160" x2="290" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="170" y="178" font-size="9" fill="#555">manages</text>

  <!-- Offices -> Assets (1:N) -->
  <line x1="420" y1="140" x2="380" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="172" font-size="9" fill="#555">contains</text>

  <!-- Categories -> Assets (1:N) -->
  <line x1="720" y1="140" x2="410" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="590" y="165" font-size="9" fill="#555">classifies</text>

  <!-- Users -> Requisitions (1:N) -->
  <line x1="150" y1="160" x2="560" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="178" font-size="9" fill="#555">submits</text>

  <!-- Requisitions -> Procurement (1:N) -->
  <line x1="560" y1="340" x2="180" y2="400" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="368" font-size="9" fill="#555">triggers</text>

  <!-- Users -> System Logs (1:N) -->
  <line x1="110" y1="160" x2="340" y2="420" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="300" font-size="9" fill="#555">creates</text>

  <!-- Users -> Notifications (1:N) -->
  <line x1="170" y1="160" x2="560" y2="400" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="290" font-size="9" fill="#555">receives</text>

  <!-- Users -> Access Logs (1:N) -->
  <line x1="190" y1="120" x2="760" y2="400" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="260" font-size="9" fill="#555">generates</text>

  <!-- Requisitions -> Users (approvedBy) -->
  <line x1="610" y1="340" x2="610" y2="400" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="375" font-size="9" fill="#555">resolved by</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="30" y="560" width="840" height="45" rx="5" fill="#f8f9fa" stroke="#ddd"/>
  <text x="45" y="580" font-size="11" font-weight="bold" fill="#333">Legend:</text>
  <text x="45" y="595" font-size="10" fill="#555">PK = Primary Key | FK = Foreign Key | (1:N) = One-to-Many Relationship</text>
  <text x="350" y="595" font-size="10" fill="#555">All entities stored in Firebase Firestore (cloud NoSQL database)</text>
</svg>

<p class="caption">Figure 4. Entity-Relationship Diagram showing the major data entities and their relationships in the Centralized Inventory and Resource Tracking System of LGU Tibiao.</p>

</body>
</html>
